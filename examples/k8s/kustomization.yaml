# Sender, receiver and a demo sink in one namespace.
#
#   kubectl apply -f examples/k8s/namespace.yaml
#   (umask 077; mkdir -p keys; for k in api_token data_key; do openssl rand -hex 32 >keys/$k; done)
#   kubectl -n udp-diode create secret generic udp-diode-keys --from-file=keys/
#   kubectl apply -k examples/k8s
#
# Files, not --from-literal, so the keys never appear on a command line. In production
# create the Secret from your secret store (External Secrets, Sealed Secrets, SOPS).
#
# In one namespace NetworkPolicy, not a physical link, keeps the data path one-way. Put the
# receiver in another cluster or behind a hardware diode for a real boundary.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: udp-diode

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - sender.yaml
  - receiver.yaml
  - sink.yaml

labels:
  - pairs: {app.kubernetes.io/part-of: udp-diode}
    includeSelectors: false

images:
  - name: udp-diode
    newName: ghcr.io/newen-systems/udp-diode
    newTag: 0.1.0

# Generated names carry a content hash, so a config change rolls the pods.
configMapGenerator:
  - name: udp-diode-sender
    envs: [sender.env]
  - name: udp-diode-receiver
    envs: [receiver.env]
  - name: udp-diode-sink
    files: [sink.py]
