# Default deny, then only the one-way data path: sender -> receiver UDP 9400 -> sink.
# Nothing is allowed from the receiver back to the sender. Needs a CNI that enforces
# NetworkPolicy (Calico, Cilium, ...).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: udp-diode-sender
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sender}
  policyTypes: [Ingress, Egress]
  ingress:
    # Clients POST objects here. Narrow "from" to your producers.
    - ports: [{port: 8080, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: receiver}}}]
      ports: [{port: 9400, protocol: UDP}]
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: udp-diode-receiver
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: receiver}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sender}}}]
      ports: [{port: 9400, protocol: UDP}]
    # Probes and operator reads of /v1/stats (token protected).
    - ports: [{port: 8080, protocol: TCP}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sink}}}]
      ports: [{port: 8081, protocol: TCP}]
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: udp-diode-sink
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sink}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: receiver}}}]
      ports: [{port: 8081, protocol: TCP}]
