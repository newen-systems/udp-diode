# Demo destination: records the SHA-256 of each object the receiver delivers.
# Replace DIODE_DELIVERY_URL (receiver.env) and the receiver egress policy with your own target.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: udp-diode-sink
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-diode-sink
  labels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sink}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sink}
  template:
    metadata:
      labels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sink}
    spec:
      serviceAccountName: udp-diode-sink
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sink
          image: udp-diode
          command: ["python", "/sink/sink.py"]
          ports: [{name: http, containerPort: 8081, protocol: TCP}]
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: code, mountPath: /sink, readOnly: true}]
      volumes:
        - {name: code, configMap: {name: udp-diode-sink}}
---
apiVersion: v1
kind: Service
metadata:
  name: udp-diode-sink
  labels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sink}
spec:
  selector: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sink}
  ports: [{name: http, port: 8081, targetPort: http, protocol: TCP}]
