# A second sender whose receiver is on another site, for the cross-site (VPN) benchmark.
# The receiver's return receipts reach this pod through a LoadBalancer address. Local traffic
# policy keeps the receiver's source address, so the NetworkPolicy can admit only that host.
#
#   REMOTE=192.0.2.10   # receiver host
#   sed "s/RECEIVER_IP/$REMOTE/g" examples/k8s/sender-remote.yaml | kubectl -n <ns> apply -f -
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: udp-diode-sender-remote
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 3Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: udp-diode-sender-remote
data:
  DIODE_MODE: sender
  DIODE_FEEDBACK: receipts
  DIODE_STATE_DIR: /var/lib/diode
  DIODE_API_TOKEN_FILE: /run/secrets/diode/api_token
  DIODE_DATA_KEY_FILE: /run/secrets/diode/data_key
  DIODE_RECEIPT_KEY_FILE: /run/secrets/diode/receipt_key
  DIODE_DATA_PEER: RECEIVER_IP:9400
  DIODE_MAX_BITRATE_MBPS: "40"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-diode-sender-remote
  labels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sender-remote}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sender-remote}
  template:
    metadata:
      labels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sender-remote}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: udp-diode-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 20
      containers:
        - name: diode
          image: newen-docker-dev.artifactory.newen.au/udp-diode@sha256:9fba237a88ecc1939871ca738026083d59fcf9ca8bdf2626ccce09efd66f266f
          envFrom: [{configMapRef: {name: udp-diode-sender-remote}}]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
            - {name: receipts, containerPort: 9401, protocol: UDP}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: state, mountPath: /var/lib/diode}
            - {name: keys, mountPath: /run/secrets/diode, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: state, persistentVolumeClaim: {claimName: udp-diode-sender-remote}}
        - {name: keys, secret: {secretName: udp-diode-keys, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: udp-diode-sender-remote
spec:
  selector: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sender-remote}
  ports: [{name: http, port: 8080, targetPort: http, protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata:
  name: udp-diode-sender-remote-receipts
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sender-remote}
  ports: [{name: receipts, port: 9401, targetPort: receipts, protocol: UDP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: udp-diode-sender-remote
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: udp-diode, app.kubernetes.io/component: sender-remote}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ipBlock: {cidr: RECEIVER_IP/32}}]
      ports: [{port: 9401, protocol: UDP}]
    - ports: [{port: 8080, protocol: TCP}]
  egress:
    - to: [{ipBlock: {cidr: RECEIVER_IP/32}}]
      ports: [{port: 9400, protocol: UDP}]
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
