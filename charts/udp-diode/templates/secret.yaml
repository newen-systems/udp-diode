{{- if not .Values.keys.existingSecret }}
{{- $name := include "udp-diode.keysSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "udp-diode.labels" (list . "keys") | nindent 4 }}
  annotations:
    # Deleting the release keeps the keys, so a reinstall still matches the other side.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $old }}
  api_token: {{ index $old.data "api_token" }}
  data_key: {{ index $old.data "data_key" }}
  {{- else }}
  api_token: {{ randAlphaNum 48 | b64enc }}
  data_key: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
