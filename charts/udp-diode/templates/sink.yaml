{{- if .Values.sink.enabled }}
{{- $name := printf "%s-sink" (include "udp-diode.fullname" .) }}
{{- $code := .Files.Get "files/sink.py" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "udp-diode.labels" (list . "sink") | nindent 4 }}
data:
  sink.py: |
    {{- $code | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "udp-diode.labels" (list . "sink") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "udp-diode.labels" (list . "sink") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "udp-diode.selector" (list . "sink") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "udp-diode.labels" (list . "sink") | nindent 8 }}
      annotations:
        checksum/code: {{ $code | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "udp-diode.podSecurityContext" . | nindent 8 }}
      containers:
        - name: sink
          image: {{ include "udp-diode.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/sink/sink.py"]
          ports: [{name: http, containerPort: 8081, protocol: TCP}]
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5, timeoutSeconds: 3}
          resources: {{- toYaml .Values.sink.resources | nindent 12 }}
          securityContext: {{- include "udp-diode.containerSecurityContext" . | nindent 12 }}
          volumeMounts: [{name: code, mountPath: /sink, readOnly: true}]
      volumes:
        - {name: code, configMap: {name: {{ $name }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "udp-diode.labels" (list . "sink") | nindent 4 }}
spec:
  selector: {{- include "udp-diode.selector" (list . "sink") | nindent 4 }}
  ports: [{name: http, port: 8081, targetPort: http, protocol: TCP}]
{{- end }}
