name: build
on:
  push:
    branches: [main]
    tags: ["v*"]  # a release is a pushed tag vX.Y.Z that matches VERSION
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a run on main or a tag is never cancelled
env:
  IMAGE: ghcr.io/newen-systems/udp-diode
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check VERSION and the release decision
        run: |
          .github/scripts/release.sh check "$(cat VERSION)"
          tests/release.sh
          .github/scripts/release.sh decide "$GITHUB_REF" "$(cat VERSION)"  # a tag that does not match VERSION fails here, before any build
          test "$(helm show chart charts/udp-diode | sed -n 's/^version: //p')" = "$(cat VERSION)"  # chart and image release together
      - name: Build amd64 and arm64 with buildah
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          # docker format keeps HEALTHCHECK, which the OCI format drops
          for a in amd64 arm64; do
            buildah build --format docker --platform linux/$a --build-arg APP_VERSION="$(cat VERSION)" \
              --build-arg APP_REVISION="$GITHUB_SHA" -t localhost/udp-diode:$a -f Dockerfile .
          done
      - name: Smoke test with podman (sender -> UDP -> receiver -> sink, uid 10001)
        run: ENGINE=podman tests/smoke.sh localhost/udp-diode:amd64
      - name: Export one archive per platform
        if: github.event_name == 'push'
        run: for a in amd64 arm64; do podman save -o udp-diode-$a.tar localhost/udp-diode:$a; done
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: udp-diode-*.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # contents: write creates the GitHub Release for a tag, packages: write pushes the image
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Decide whether this push is a release
        id: decide
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          .github/scripts/release.sh decide "$GITHUB_REF" "$version" | tee -a "$GITHUB_OUTPUT"
      - name: Push the manifest list to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf %s "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # copying the archives straight to the registry keeps the config blob, and with it the HEALTHCHECK
          podman manifest create udp-diode
          for a in amd64 arm64; do
            skopeo copy --format v2s2 docker-archive:udp-diode-$a.tar "docker://$IMAGE:$GITHUB_SHA-$a"
            podman manifest add udp-diode "docker://$IMAGE:$GITHUB_SHA-$a"
          done
          # only the sha tag moves here; the tags users pull move after the pushed image has passed
          podman manifest push --format v2s2 udp-diode "docker://$IMAGE:$GITHUB_SHA"
          skopeo inspect --raw "docker://$IMAGE:$GITHUB_SHA" | grep -E '"architecture"'
      - name: Run the pushed image
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          podman pull "$IMAGE:$GITHUB_SHA"
          test "$(podman run --rm --entrypoint id "$IMAGE:$GITHUB_SHA" -u)" = 10001
          podman run --rm --entrypoint printenv "$IMAGE:$GITHUB_SHA" APP_VERSION | grep -qx "$VERSION"
          podman run --rm --entrypoint printenv "$IMAGE:$GITHUB_SHA" APP_REVISION | grep -qx "$GITHUB_SHA"
          ENGINE=podman tests/smoke.sh "$IMAGE:$GITHUB_SHA"
      - name: Move the tags users pull
        env:
          RELEASE: ${{ steps.decide.outputs.release }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          # main moves edge. A release tag publishes X.Y.Z, X.Y, X and latest. Same manifest list, same digest.
          tags=()
          [ "$GITHUB_REF" = refs/heads/main ] && tags+=(edge)
          if [ "$RELEASE" = true ]; then tags+=("$VERSION" "${VERSION%.*}" "${VERSION%%.*}" latest); fi
          for t in "${tags[@]}"; do skopeo copy --all --preserve-digests "docker://$IMAGE:$GITHUB_SHA" "docker://$IMAGE:$t"; done
          for t in "${tags[@]}"; do test "$(skopeo inspect --raw "docker://$IMAGE:$t" | sha256sum)" = "$(skopeo inspect --raw "docker://$IMAGE:$GITHUB_SHA" | sha256sum)"; done
      - name: Push the Helm chart to ghcr.io
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          printf %s "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/udp-diode
          helm push "udp-diode-$VERSION.tgz" oci://ghcr.io/newen-systems/charts
      - name: Create the GitHub Release for the tag
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          raw=$(skopeo inspect --raw "docker://$IMAGE:$GITHUB_SHA")
          {
            cat RELEASE_NOTES.md
            printf '\n## Image\n\n`%s:%s` (also `%s`, `%s` and `latest`), linux/amd64 and linux/arm64, uid 10001.\n\n' "$IMAGE" "$VERSION" "${VERSION%.*}" "${VERSION%%.*}"
            printf 'Helm chart: `helm install udp-diode oci://ghcr.io/newen-systems/charts/udp-diode --version %s`\n\n' "$VERSION"
            printf 'Manifest list: `%s@sha256:%s`\n\n' "$IMAGE" "$(printf %s "$raw" | sha256sum | cut -d' ' -f1)"
            printf %s "$raw" | jq -r '.manifests[] | "- \(.platform.os)/\(.platform.architecture): `\(.digest)`"'
          } > notes.md
          gh release create "v$VERSION" --verify-tag --title "udp-diode $VERSION" --notes-file notes.md
