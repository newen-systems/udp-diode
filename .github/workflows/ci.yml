name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: tests/release.sh
      - name: Kubernetes example renders
        run: |
          kubectl kustomize examples/k8s > rendered.yaml
          grep -q 'image: ghcr.io/newen-systems/udp-diode:' rendered.yaml
          grep -q 'pod-security.kubernetes.io/enforce: restricted' rendered.yaml

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose demo, strict one-way and with receipts
        run: |
          examples/demo.sh
          examples/demo.sh receipts
